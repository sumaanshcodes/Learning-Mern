 Ques:- What is HTML?
 Ans:- HTML stands for Hyper Text Markup Language. It is the Standard
       markup language for creating web pages and web applications.
       It is used to describe the structure of webpages using markup.

    # HyperText: It means text that contains links to other text or pages.


    Example:
When you click a link and move to another page.

Example:
Google → YouTube

This connection between documents is called hypertext.

    # Markup Language: It is a computer language that defines the structure 
      and presentation of raw text.

    # Markup means "making" content using tagss.
    Ex: <p>Hello, World!</p>

##             Definition:

-- HTML is used to create the structure of webpages.

House example:

HTML = Structure (walls, rooms)
CSS = Design (paint, decoration)
JavaScript = Functionality (fan, lights, doorbell)

Without HTML, no webpage exists.


# Why HTML??
- HTML is important because it:
  - Creates webpages structure
  - Organizes content
  - Connects pages
  - Displays text, images, videos, and other media
  - Creates forms
  - Helps with SEO (Search Engine Optimization)
  - Helps with accessibility (making websites usable for people with disabilities)


# How Browser Understands HTML?
- Answer in steps:

 - Step 1: The browser sends a request to the server for a webpage.
 - Step 2: The server sends the HTML file to the browser.   
 - Step 3: The browser reads the HTML file and interprets the tags to display the content on the screen.
 - Step 4: The browser applies CSS styles and executes JavaScript code to enhance the webpage's appearance and functionality.
 - Step 5: The browser renders the final webpage for the user to view and interact with.
 - Step 6: The user can interact with the webpage, and any further requests (like clicking links or submitting forms) will repeat the process.
 

# What can HTML Create?
 - Text content (headings, paragraphs, lists)
    -> Ex: <h1>Heading</h1>, <p>Paragraph</p>, <ul><li>List Item</li></ul>
 - Images and multimedia (audio, video)
    -> Ex: <img src="image.jpg" alt="Description">, <audio controls><source src="audio.mp3" type="audio/mpeg"></audio>
 - Links to other pages or websites
    -> Ex: <a href="https://www.example.com">Link Text</a>
 - Forms for user input (contact forms, surveys)
    -> Ex: <form><input type="text" name="username"></form>
 - Tables for displaying data
    -> Ex: <table><tr><th>Header 1</th><th>Header 2</th></tr><tr><td>Data 1</td><td>Data 2</td></tr></table>
 - Interactive elements (buttons, checkboxes, radio buttons)
    -> Ex: <button>Click Me</button>, <input type="checkbox" name="option1">        
 - Semantic structure (using tags like <header>, <footer>, <article>, <section>)    
    -> Ex: <header>, <footer>, <article>, <section>
 - Metadata (using <meta> tags for SEO and social media sharing)
    -> Ex: <meta name="description" content="This is a sample webpage.">
