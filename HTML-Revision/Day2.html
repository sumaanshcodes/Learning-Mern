Before writing websites, you must understand **how the internet and websites actually work**.

Because when you start working with Node.js, Express.js, MongoDB, APIs, authentication, etc., this chapter becomes the foundation.

# 1. What is a Website?

A website is a collection of webpages connected together.

Example:

* Homepage
* About page
* Contact page
* Login page

Think of a website like a book:

Book:

* Many pages

Website:

* Many webpages

Example:
A site like Google has:

* Search page
* Gmail
* Drive
* Maps

All are webpages.

---

# 2. What Happens When You Open a Website?

Suppose you type:

`www.google.com`

Process:

### Step 1: Browser sends request

Your browser asks:

"Give me Google’s webpage."

This is called a **request**.

Example:
You = customer
Restaurant = website server

You ask for food.

That asking = request.

---

### Step 2: DNS finds server

Browser does not understand names.

It needs IP.

Example:

Google.com → 142.250.xx.xx

DNS converts:

Domain → IP

Like phonebook.

Example:
"Rahul" → Phone number

Same:

Google.com → IP address

---

### Step 3: Server receives request

The server receives:

"User wants homepage."

Server is a computer storing website files.

Files:

* HTML
* CSS
* JavaScript
* Images
* Database data

---

### Step 4: Server sends response

Server sends files back.

This is called **response**.

Example:

Request:
"Give me homepage."

Response:
"Here it is."

---

### Step 5: Browser renders webpage

Browser reads:

* HTML
* CSS
* JavaScript

And shows the webpage.

Final:
You see website.

Flow:

User → Browser → DNS → Server → Browser → Screen

Very important.

---

# 3. Client and Server

This is the most important concept in MERN.

---

## Client

Client means the user side.

Examples:

* Browser
* Mobile app
* Desktop app

Client requests data.

Example:
Chrome browser.

When you open:

`youtube.com`

Chrome is client.

---

## Server

Server provides data.

It handles:

* requests
* database
* authentication
* business logic

Example:

You ask for YouTube videos.

Server sends video data.

---

## Example

Instagram:

Client:
App or browser

Server:
Instagram servers

Database:
Stores users, posts, comments

Flow:

User opens app
↓
Client sends request
↓
Server processes
↓
Database fetches data
↓
Server sends response
↓
Client displays data

---

# 4. Client-Server Architecture

Architecture means system design.

Basic architecture:

```text
Client → Server → Database
```

Example:

Login:

```text
User enters email/password
↓
Client sends login request
↓
Server checks database
↓
Database returns user
↓
Server verifies password
↓
Server sends response
↓
Client logs in
```

This is exactly how your projects like CoachCode.ai work.

# 7. Browser Rendering Process

Important.

When browser gets files:

---

## Step 1: Parse HTML

Example:

```html id="t8v2pm"
<h1>Hello</h1>
```

Browser reads it.

Creates DOM.

DOM:

```text
Document
└── h1
    └── Hello
```

---

## Step 2: Parse CSS

Example:

```css id="u6g4we"
h1 {
 color: blue;
}
```

Creates CSSOM.

CSS Object Model.

---

## Step 3: Combine DOM + CSSOM

Creates Render Tree.

Example:

```text
h1 → blue → visible
```

---

## Step 4: Layout

Browser calculates:

* width
* height
* position

Example:
Where heading should appear.

---

## Step 5: Paint

Browser draws pixels.

Now webpage becomes visible.

Flow:

HTML → DOM
CSS → CSSOM
DOM + CSSOM → Render Tree
Layout → Paint

Very important for optimization.
